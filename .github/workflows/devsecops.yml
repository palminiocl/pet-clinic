name: DevSecOps Pipeline

on:
  push:




jobs:

  SAST:
    permissions:
        # required for all workflows
        security-events: write

        # required to fetch internal or private CodeQL packs
        packages: read

        # only required for workflows in private repositories
        actions: read
        contents: read

    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
            # Analyzes Java code directly from the codebase without a build
            languages: java-kotlin
            build-mode: none # analyzes Java only
            queries: security-extended

    # Analyzes the code with CodeQL.    
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
            category: "/language:java"
            wait-for-processing: true

      - name: Fail SAST when CodeQL alerts exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          alert_count=$(gh api "/repos/${REPO}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" --jq 'length')
          if [ "$alert_count" -gt 0 ]; then
            echo "CodeQL found ${alert_count} open alert(s). Failing SAST."
            exit 1
          fi


  SCA:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:    
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Tree MVN
        run: mvn dependency:tree
        
      - name: Build project with Maven
        run: mvn clean package
      
      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }} 
          path: '.'
          format: 'HTML'
          out: 'reports'
          # Fail the build if a vulnerability with a CVSS score of 4 or higher is found
          args: >
            --disableCentral
            --failOnCVSS 4
      - name: Upload a Build Artifact
      # This step will run even if the previous step fails
        if: always() 
        uses: actions/upload-artifact@v7.0.1
        with:    
          name: dependency-check-report    
          path: ${{ github.workspace }}/reports

  docker-build:
    name: Docker Build
    needs:
      - SAST
      - SCA

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t spring-petclinic:${{ github.sha }} \
            .
  
  image-security:
    name: Image Security - Trivy
    needs: docker-build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t spring-petclinic:${{ github.sha }} \
            .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "spring-petclinic:${{ github.sha }}"
          format: "table"
          # Fallara si se encuentra alguna vulnerabilidad
          exit-code: "1" # Fallara si se encuentra alguna vulnerabilidad
          ignore-unfixed: true 
          vuln-type: "os,library"
          severity: "MEDIUM,HIGH,CRITICAL" # Fallara si se encuentra alguna vulnerabilidad con severidad MEDIUM, HIGH o CRITICAL